# MTG singles bot: new listings (each store's latest batch) priced well below other stores.
#
# Scheduled runs are DRY RUNS: they build the report, attach it to the run, publish it to GitHub
# Pages (built by build_site.py) and send no email. The web pages are kept in the docs folder, which
# this workflow commits back to the repository after each scheduled run.
#
# The Re-scan button on the published page starts this workflow with "dry run" ticked and "quick" unticked.
#
# Manual runs build the report and attach it. A manual dry run with "quick" unticked also publishes the
# page. A quick run reads only 2 pages per store, so it never publishes.
# To get the report by email, run this workflow by hand and untick "dry run".
#
# Safe to run in production? Yes. It only reads public web pages, makes one request to Scryfall for set
# names, and sends one email only when you untick dry run by hand. It changes nothing in your tenant or
# on any server, and the only files it writes to the repository are in the docs folder. Use a personal
# repository for it.
#
# Uses the same email secrets as the sealed-product bot (MAIL_TO, MAIL_FROM, and either the GRAPH_*
# secrets or the SMTP_* secrets).

name: MTG singles

on:
  schedule:
    # GitHub cron is always UTC. 21:47 UTC is 8:17am Adelaide during daylight saving
    # (ACDT) and 7:17am once daylight saving ends in April (ACST). This is 30 minutes after
    # the sealed-product bot so the two never run at the same time.
    - cron: "47 21 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Build the report but do not send the email"
        type: boolean
        default: true
      quick:
        description: "Quick test: read only 2 pages per store (about 500 listings each). A quick run never publishes the page."
        type: boolean
        default: true
      new_days:
        description: "Window in days, measured back from each store's newest listing (use 7 or more for a first test)"
        type: string
        default: "2"

# Needed so the run can save the docs folder.
permissions:
  contents: write

# Never run two copies at once, because both would write the docs folder.
concurrency:
  group: mtg-singles
  cancel-in-progress: false

jobs:
  run-bot:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Get the repository files
        uses: actions/checkout@v7

      - name: Install Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install requests
        run: pip install requests

      # Only a manual run with dry run unticked sends an email.
      - name: Run bot and send email
        if: ${{ github.event_name == 'workflow_dispatch' && !inputs.dry_run }}
        env:
          NEW_DAYS: ${{ inputs.new_days || '2' }}
          MAIL_FROM: ${{ secrets.MAIL_FROM }}
          MAIL_TO: ${{ secrets.MAIL_TO }}
          # Option A: Microsoft Graph. Used when SMTP_HOST is not set.
          GRAPH_TENANT_ID: ${{ secrets.GRAPH_TENANT_ID }}
          GRAPH_CLIENT_ID: ${{ secrets.GRAPH_CLIENT_ID }}
          GRAPH_CLIENT_SECRET: ${{ secrets.GRAPH_CLIENT_SECRET }}
          # Option B: SMTP, for example Gmail with an app password.
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
        run: |
          case "$NEW_DAYS" in ''|*[!0-9]*) echo "new_days must be a whole number"; exit 1 ;; esac
          python mtg_singles_bot.py --new-days "$NEW_DAYS" ${{ inputs.quick && '--max-pages 2' || '' }}

      # Scheduled runs, and manual runs with dry run ticked, build report.html and attach it to the run.
      # A scheduled run has no inputs, so it reads every page with the 2 day window.
      - name: Run bot (dry run)
        if: ${{ github.event_name == 'schedule' || inputs.dry_run }}
        env:
          NEW_DAYS: ${{ inputs.new_days || '2' }}
        run: |
          case "$NEW_DAYS" in ''|*[!0-9]*) echo "new_days must be a whole number"; exit 1 ;; esac
          python mtg_singles_bot.py --dry-run --new-days "$NEW_DAYS" ${{ inputs.quick && '--max-pages 2' || '' }}

      - name: Attach the report
        if: ${{ github.event_name == 'schedule' || inputs.dry_run }}
        uses: actions/upload-artifact@v7
        with:
          name: singles-report
          path: report.html
          retention-days: 14

      # Builds the styled web pages with build_site.py, then saves them.
      # It runs only after the bot finished without an error.
      # The RESCAN_ settings switch on the Re-scan button on the page. RESCAN_INPUTS must match what
      # makes this step run (dry run ticked and quick unticked).
      - name: Publish report
        if: ${{ github.event_name == 'schedule' || (inputs.dry_run && !inputs.quick) }}
        env:
          SITE_TITLE: MTG singles
          SITE_KICKER: Singles scan
          SITE_CURRENT: Singles
          SITE_NAV: "Sealed|https://alex-speed.github.io/mtg-deal-bot/;Singles|https://alex-speed.github.io/mtg-singles-daily/"
          RESCAN_REPO: ${{ github.repository }}
          RESCAN_WORKFLOW: mtg-singles.yml
          RESCAN_REF: ${{ github.ref_name }}
          RESCAN_INPUTS: "dry_run=true,quick=false"
          RESCAN_EXPECT: "540"
        run: |
          set -euo pipefail
          python build_site.py
          [ -d docs ] && git add docs || true
          if git diff --cached --quiet; then
            echo "Nothing new to save"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Update report"
          git pull --rebase
          git push
