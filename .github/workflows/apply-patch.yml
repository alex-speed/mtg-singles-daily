name: Apply 5 day patch

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run the patch
        run: python3 patch_recent_only.py

      - name: Commit the two patched files
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add mtg_singles_bot.py build_site.py
          if git diff --cached --quiet; then
            echo "Nothing changed."
          else
            git commit -m "Singles page: last 5 days only, highlight today"
            git push
          fi
